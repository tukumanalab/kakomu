[package]
name = "kakomu"
version = "0.1.0"
description = "アクリルスタンド・アクリルキーホルダーを作るためのベクターエディタ"
authors = ["Junya Ishihara"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "kakomu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff"] }

# 背景除去。推論はすべて手元で動かし、画像を外に出さない（SPEC 11.4）
ort = "=2.0.0-rc.9"
# ort-sys は先の版に解決されると TLS 機能の指定を要求してくるので、揃えて固定する
ort-sys = "=2.0.0-rc.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

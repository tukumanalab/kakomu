[package]
name = "kakomu"
version = "0.1.0"
description = "アクリルスタンド・アクリルキーホルダーを作るためのベクターエディタ"
authors = ["Junya Ishihara"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "kakomu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
